services:
  database:
    image: postgres:16-alpine
    container_name: reservation-center-postgres
    environment:
      POSTGRES_DB: resource_center
      POSTGRES_USER: resource_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./database/Reservations.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/Reservations.demo.fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql:ro
      - ./database/Reservations.resources.fixtures.sql:/docker-entrypoint-initdb.d/03-resources-fixtures.sql:ro
      - ./database/Reservations.equipment.fixtures.sql:/docker-entrypoint-initdb.d/04-equipment-fixtures.sql:ro
      - ./database/Reservations.resources.fixtures.sql:/docker-entrypoint-initdb.d/04-resources-fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_center -d resource_center"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  symfony_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: reservation-center-symfony
    ports:
      - "8000:8000"
    working_dir: /var/www/html
    volumes:
      - ./app/bin:/var/www/html/bin
      - ./app/composer.json:/var/www/html/composer.json
      - ./app/composer.lock:/var/www/html/composer.lock
      - ./app/config:/var/www/html/config
      - ./app/public:/var/www/html/public
      - ./app/src:/var/www/html/src
      - ./app/symfony.lock:/var/www/html/symfony.lock
      - ./app/templates:/var/www/html/templates
      - ./app/translations:/var/www/html/translations
      - symfony_vendor:/var/www/html/vendor
      - symfony_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: ${DEFAULT_URI:-http://127.0.0.1:8000}
      DATABASE_URL: "postgresql://resource_center:${POSTGRES_PASSWORD}@database:5432/resource_center?serverVersion=16&charset=utf8"
    restart: unless-stopped

volumes:
  database_data:
  symfony_vendor:
  symfony_var:
